# Runs the app on a test phone in the cloud and saves pictures of each screen
# and any crash report to the "device-check" pre-release. Used while developing
# on the dev branch, before changes go to main.
name: Device check

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: device-check
  cancel-in-progress: true

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: ./gradlew :core:test :app:assembleDebug

      - name: Serve a short test film with captions to the test phone
        run: |
          mkdir -p /tmp/tvsite
          (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg) > /tmp/tvsite/setup.log 2>&1 || true
          # Twelve seconds of a film with faces in it (the blur test counts faces), or, failing that, a made-up picture and sound.
          ffmpeg -nostdin -loglevel error -ss 52 -t 12 -i https://media.xiph.org/tearsofsteel/tears_of_steel_1080p.webm \
            -vf scale=640:-2 -c:v libvpx -b:v 900k -c:a libvorbis /tmp/tvsite/clip.webm >> /tmp/tvsite/setup.log 2>&1 \
          || ffmpeg -nostdin -loglevel error -f lavfi -i testsrc=size=640x360:rate=25 -f lavfi -i sine=frequency=440 -t 12 \
            -c:v libvpx -b:v 900k -c:a libvorbis /tmp/tvsite/clip.webm >> /tmp/tvsite/setup.log 2>&1 || true
          printf 'WEBVTT\n\n00:00:02.000 --> 00:00:03.500\nOh shit, look at that\n\n00:00:06.000 --> 00:00:07.000\nA clean line\n' > /tmp/tvsite/clip.vtt
          printf '<!doctype html><title>Test clip</title><meta name="viewport" content="width=device-width"><video src="clip.webm" autoplay playsinline controls style="width:100%%"><track kind="subtitles" srclang="en" src="clip.vtt"></video>' > /tmp/tvsite/page.html
          cd /tmp/tvsite && nohup python3 -m http.server 8765 > /tmp/tvsite.log 2>&1 &
          sleep 2; ls -la /tmp/tvsite; curl -s -o /dev/null -w 'page %{http_code}\n' http://127.0.0.1:8765/page.html

      - name: Allow the test phone to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on a test phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/device-check.sh

      - name: Save the pictures and reports
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view device-check >/dev/null 2>&1 || gh release create device-check --prerelease --target dev --title "Device check (development)" --notes "Screens and reports from the automatic test phone. Not a download for use."
          for f in device-out/*; do
            gh release upload device-check "$f" --clobber || { sleep 5; gh release upload device-check "$f" --clobber; } || echo "could not upload $f"
          done
