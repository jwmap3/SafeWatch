# Builds the app on GitHub and puts the APK on the repository's Releases page.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the logic tests
        run: ./gradlew :core:test

      - name: Build the APK
        run: ./gradlew :app:assembleEdenosDebug :app:assembleCleanchromeDebug

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/edenos/debug/app-edenos-debug.apk EdenOS.apk
          # CleanChrome: the browser on its own, as a separate app.
          cp app/build/outputs/apk/cleanchrome/debug/app-cleanchrome-debug.apk CleanChrome.apk
          # The app was first called SafeWatch; the old file name keeps working for links saved before.
          cp EdenOS.apk SafeWatch.apk
          notes="Test build from commit ${GITHUB_SHA::7}. Download EdenOS.apk below and open it on your Android phone. CleanChrome.apk is its browser as an app of its own. (SafeWatch.apk is EdenOS.apk under the app's old name.)"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "EdenOS test build" --notes "$notes"
          else
            gh release create latest --title "EdenOS test build" --notes "$notes"
          fi
          gh release upload latest EdenOS.apk SafeWatch.apk CleanChrome.apk --clobber
