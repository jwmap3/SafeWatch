# Builds the app on GitHub and puts the APK on the repository's Releases page.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the logic tests
        run: ./gradlew :core:test

      - name: Build the APK
        run: ./gradlew :app:assembleDebug

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SafeWatch.apk
          notes="Test build from commit ${GITHUB_SHA::7}. Download SafeWatch.apk below and open it on your Android phone."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --notes "$notes"
          else
            gh release create latest --title "SafeWatch test build" --notes "$notes"
          fi
          gh release upload latest SafeWatch.apk --clobber
