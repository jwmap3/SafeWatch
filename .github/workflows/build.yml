# Builds the app on GitHub and puts the APK on the repository's Releases page.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the logic tests
        run: ./gradlew :core:test

      - name: Build the APK
        env:
          # Set this in the repo's Settings > Secrets to build the family Claude key into the download.
          CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
        run: ./gradlew :app:assembleEdenosDebug :app:assembleCleanchromeDebug

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/edenos/debug/app-edenos-debug.apk EdenOS.apk
          # CleanChrome: the browser on its own, as a separate app.
          cp app/build/outputs/apk/cleanchrome/debug/app-cleanchrome-debug.apk CleanChrome.apk
          # The app was first called SafeWatch; the old file name keeps working for links saved before.
          cp EdenOS.apk SafeWatch.apk
          # EdenOS-phone.apk: the same app with only the 64-bit phone library, half the size, signed with the same key
          # so it installs over either one. Small enough to send as an attachment.
          cp EdenOS.apk phone-unaligned.apk
          zip -q -d phone-unaligned.apk 'lib/x86/*' 'lib/x86_64/*' 'lib/armeabi-v7a/*' 'META-INF/*'
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 phone-unaligned.apk phone-aligned.apk
          "$BT/apksigner" sign --ks app/debug.keystore --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey --out EdenOS-phone.apk phone-aligned.apk
          "$BT/apksigner" verify EdenOS-phone.apk
          ls -la EdenOS.apk EdenOS-phone.apk CleanChrome.apk
          notes="Test build from commit ${GITHUB_SHA::7}. Download EdenOS.apk below and open it on your Android phone. EdenOS-phone.apk is the same app, smaller, for phones. CleanChrome.apk is its browser as an app of its own. (SafeWatch.apk is EdenOS.apk under the app's old name.)"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "EdenOS test build" --notes "$notes"
          else
            gh release create latest --title "EdenOS test build" --notes "$notes"
          fi
          gh release upload latest EdenOS.apk EdenOS-phone.apk SafeWatch.apk CleanChrome.apk --clobber
